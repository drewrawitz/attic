packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# None of these install scripts is needed. The workerd and esbuild binaries arrive as optional
# dependencies, and the core-js-pure script only prints a banner.
allowBuilds:
  core-js-pure: false
  esbuild: false
  workerd: false
