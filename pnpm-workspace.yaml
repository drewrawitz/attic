packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # Alchemy pins an older workerd. Deployed D1 runs SQLite 3.54.1, which refuses to read a CTE
  # once a statement holds 100 tables, and this is the first workerd with it, so local D1
  # refuses the same statements. Drop this once Alchemy pins 1.20261106.1 or later.
  workerd: 1.20261106.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# None of these install scripts is needed. The workerd and esbuild binaries arrive as optional
# dependencies, and the core-js-pure script only prints a banner.
allowBuilds:
  core-js-pure: false
  esbuild: false
  workerd: false
